  <text x="357" y="245" class="item">typescript.md</text>
  <text x="357" y="261" class="item">styling.md</text>
  <text x="357" y="277" class="item">testing.md</text>
  <text x="357" y="293" class="item">documentation.md</text>
  <text x="357" y="309" class="item">env-config.md</text>
  <text x="357" y="383" class="count">Path-scoped, lazy-loaded</text>

