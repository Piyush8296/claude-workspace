  <!-- Hooks section -->
  <rect x="80" y="430" width="620" height="130" rx="8" fill="#f8f9fa" stroke="#e0e0e0" class="bg-box"/>
  <rect x="80" y="430" width="620" height="28" rx="8" fill="#7c3aed"/>
  <rect x="80" y="446" width="620" height="12" fill="#7c3aed"/>
  <text x="390" y="449" text-anchor="middle" class="label">Hooks — 10 Deterministic Quality Gates</text>

  <text x="105" y="478" class="item" font-weight="600">PreToolUse:</text>
  <text x="195" y="478" class="item">Branch guard (block main edits) + File protection (.env, secrets)</text>

  <text x="105" y="498" class="item" font-weight="600">PostToolUse:</text>
  <text x="195" y="498" class="item">Prettier auto-format + TypeScript check + Test runner</text>
  <text x="195" y="514" class="item">Dep installer + Auto-commit + UI screenshot capture</text>

  <text x="105" y="534" class="item" font-weight="600">Stop:</text>
  <text x="195" y="534" class="item">macOS notification + Vercel preview deploy</text>

</svg>