<svg viewBox="0 0 780 580" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Claude Workspace Architecture</title>
  <desc>Repository structure: 18 skills, 8 agents, 12 commands, 5 rules, 10 hooks</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    .subtitle { font-size: 11px; fill: #666; }
    .label { font-size: 11px; font-weight: 600; fill: white; }
    .item { font-size: 9.5px; fill: #1a1a1a; }
    .count { font-size: 9px; fill: #888; }
    .connector { stroke: #ddd; stroke-width: 1.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #f0f0f0; }
      .subtitle { fill: #aaa; }
      .item { fill: #e0e0e0; }
      .count { fill: #999; }
      .connector { stroke: #444; }
      .bg-box { fill: #1e1e1e; stroke: #333; }
    }
  </style>

  <!-- Title -->
  <text x="390" y="28" text-anchor="middle" class="title">claude-workspace / Frontend Engineering</text>
  <text x="390" y="44" text-anchor="middle" class="subtitle">Production-grade Claude Code config — 18 skills, 8 agents, 12 commands, 5 rules, 10 hooks</text>

  <!-- CLAUDE.md (center top) -->
  <rect x="300" y="60" width="180" height="36" rx="8" fill="#2563eb"/>
  <text x="390" y="82" text-anchor="middle" class="label">CLAUDE.md</text>
  <text x="390" y="110" text-anchor="middle" class="count">Project memory — stack, rules, skill map (~60 lines)</text>

  <!-- settings.json -->
  <rect x="30" y="130" width="150" height="32" rx="6" fill="#7c3aed"/>
  <text x="105" y="150" text-anchor="middle" class="label">settings.json</text>
  <text x="105" y="174" text-anchor="middle" class="count">Permissions + 10 hooks</text>

  <!-- .mcp.json -->
  <rect x="600" y="130" width="150" height="32" rx="6" fill="#7c3aed"/>
  <text x="675" y="150" text-anchor="middle" class="label">.mcp.json</text>
  <text x="675" y="174" text-anchor="middle" class="count">GitHub + Filesystem MCPs</text>

  <!-- Connectors from CLAUDE.md -->
  <line x1="330" y1="96" x2="180" y2="130" class="connector"/>
  <line x1="450" y1="96" x2="600" y2="130" class="connector"/>

