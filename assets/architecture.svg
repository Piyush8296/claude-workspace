  <rect x="15" y="200" width="155" height="28" rx="8" fill="#059669"/>
  <rect x="15" y="216" width="155" height="12" fill="#059669"/>
  <text x="92" y="219" text-anchor="middle" class="label">Agents (8)</text>
  <text x="27" y="245" class="item">code-reviewer</text>
  <text x="27" y="261" class="item">performance-auditor</text>
  <text x="27" y="277" class="item">accessibility-auditor</text>
  <text x="27" y="293" class="item">refactor-planner</text>
