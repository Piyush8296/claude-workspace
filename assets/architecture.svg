  <rect x="505" y="200" width="260" height="195" rx="8" fill="#f8f9fa" stroke="#e0e0e0" class="bg-box"/>
  <rect x="505" y="200" width="260" height="28" rx="8" fill="#2563eb"/>
  <rect x="505" y="216" width="260" height="12" fill="#2563eb"/>
  <text x="635" y="219" text-anchor="middle" class="label">Skills (18)</text>
  <text x="517" y="245" class="item">react-patterns</text>
  <text x="517" y="259" class="item">state-management</text>
  <text x="517" y="273" class="item">testing-strategy</text>
  <text x="517" y="287" class="item">css-architecture</text>
  <text x="517" y="301" class="item">performance-optimization</text>
  <text x="517" y="315" class="item">accessibility</text>
  <text x="517" y="329" class="item">systematic-debugging</text>
  <text x="517" y="343" class="item">frontend-design</text>
  <text x="517" y="357" class="item">design-intelligence</text>
  <text x="650" y="245" class="item">security-audit</text>
  <text x="650" y="259" class="item">seo-fundamentals</text>
  <text x="650" y="273" class="item">structured-data</text>
  <text x="650" y="287" class="item">core-web-vitals</text>
